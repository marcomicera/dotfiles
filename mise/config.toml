[tools]
glab = "latest"
helm = "latest"
kubectl = "latest"
# happy and @getpaseo/cli are npm globals installed into this node's prefix,
# so a node must always be active or they drop off PATH entirely.
node = "26.9.0"
remotectl = "latest"
terraform = "latest"
terragrunt = "latest"

[settings]
# hook-env evals stdout; auto-install of source builds (e.g. postgres) dumps
# `./configure` "checking ..." lines into the shell as commands.
auto_install = false

[settings.gitlab]
credential_command = "glab auth status --hostname gitlab.com >/dev/null 2>&1; glab config get token --host gitlab.com"
