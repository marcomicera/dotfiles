# Modus, following the terminal palette. colorls colors through the rainbow gem,
# so the plain names (red, blue, ...) are ANSI 30-37 and resolve against whatever
# the terminal has: Modus Vivendi in dark, Modus Operandi in light. Rainbow has no
# bright-ANSI names, so the few entries that need a second shade of a colour use
# its X11 names (violet, lightgray, dimgray, lightcoral, ...), which are fixed
# tints rather than palette colours.

# Main Colors
unrecognized_file: yellow
recognized_file:   white
executable_file:   green
dir:               blue

# Link
dead_link: red
link:      cyan

# Special Files
socket:   green
blockdev: green
chardev:  green

# Access Modes
write:     magenta
read:      violet
exec:      cyan
no_access: red

# Age
hour_old:    white
day_old:     lightgray
no_modifier: dimgray

# File Size
file_large:  red
file_medium: lightcoral
file_small:  green

# Random
report: green
user:   cyan
tree:   lightgray
empty:  lightgray
error:  red
normal: white
inode:  violet

# Git
addition:     lightgreen
modification: lightblue
deletion:     red
untracked:    lightcoral
unchanged:    green
