# Modus Vivendi skin for k9s (aligned with Neovim modus-themes.nvim)

foreground: &foreground "#ffffff"
background: &background "#000000"
current_line: &current_line "#2f3849"
selection: &selection "#2f447f"
comment: &comment "#989898"
cyan: &cyan "#00d3d0"
green: &green "#44bc44"
yellow: &yellow "#d0bc00"
orange: &orange "#ff6b55"
magenta: &magenta "#b6a0ff"
blue: &blue "#2fafff"
red: &red "#ff5f59"
purple: &purple "#feacd0"
white: &white "#989898"
black: &black "#000000"
teal: &teal "#6ae4b9"
error: &error "#ff5f59"

k9s:
  body:
    fgColor: *foreground
    bgColor: default
    logoColor: *blue
  prompt:
    fgColor: *foreground
    bgColor: *background
    suggestColor: *orange
  info:
    fgColor: *blue
    sectionColor: *foreground
  dialog:
    fgColor: *foreground
    bgColor: default
    buttonFgColor: *foreground
    buttonBgColor: *blue
    buttonFocusFgColor: *background
    buttonFocusBgColor: *foreground
    labelFgColor: *comment
    fieldFgColor: *foreground
  frame:
    border:
      fgColor: *selection
      focusColor: *orange
    menu:
      fgColor: *foreground
      keyColor: *blue
      numKeyColor: *cyan
    crumbs:
      fgColor: *black
      bgColor: *blue
      activeColor: *orange
    status:
      newColor: *cyan
      modifyColor: *blue
      addColor: *green
      errorColor: *error
      highlightColor: *orange
      killColor: *comment
      completedColor: *comment
    title:
      fgColor: *foreground
      bgColor: default
      highlightColor: *blue
      counterColor: *blue
      filterColor: *orange
  views:
    charts:
      bgColor: default
      defaultDialColors:
        - *blue
        - *error
      defaultChartColors:
        - *blue
        - *error
    table:
      fgColor: *foreground
      bgColor: default
      cursorFgColor: *black
      cursorBgColor: *blue
      markColor: *orange
      header:
        fgColor: *foreground
        bgColor: default
        sorterColor: *cyan
        selectedSortColumnColor: *orange
    xray:
      fgColor: *foreground
      bgColor: default
      cursorColor: *current_line
      graphicColor: *blue
      showIcons: false
    yaml:
      keyColor: *blue
      colonColor: *comment
      valueColor: *foreground
    logs:
      fgColor: *foreground
      bgColor: default
      indicator:
        fgColor: *foreground
        bgColor: default
        toggleOffColor: *red
    help:
      fgColor: *foreground
      bgColor: default
      indicator:
        fgColor: *error
        bgColor: *selection
