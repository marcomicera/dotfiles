[mgr]
# NOTE: can be combined with tmTheme (sublime colorshceme file) for preview code highlight
syntect_theme = "~/.config/bat/themes/modus_vivendi.tmTheme"

cwd = { fg = "#989898", italic = true }

# Hovered
hovered         = { bg = "#2f3849" }
preview_hovered = { bg = "#2f3849" }

# Find
find_keyword  = { fg = "#ffffff", bg = "#7030af", bold = true }
find_position = { fg = "#00d3d0", bg = "#1e1e1e", bold = true }

# Marker
marker_copied   = { fg = "#44bc44", bg = "#44bc44" }
marker_cut      = { fg = "#ff5f59", bg = "#ff5f59" }
marker_marked   = { fg = "#b6a0ff", bg = "#b6a0ff" }
marker_selected = { fg = "#2fafff", bg = "#2fafff" }

# Count
count_copied   = { fg = "#000000", bg = "#44bc44" }
count_cut      = { fg = "#000000", bg = "#ff5f59" }
count_selected = { fg = "#000000", bg = "#2fafff" }

# Border
border_symbol = "│"
border_style  = { fg = "#c4c4c4" }

# Tab
[tabs]
active   = { fg = "#000000", bg = "#2fafff" }
inactive = { fg = "#2fafff", bg = "#303030" }

[mode]
normal_main = { fg = "#000000", bg = "#2fafff", bold = true }
normal_alt  = { fg = "#2fafff", bg = "#303030" }

select_main = { fg = "#000000", bg = "#b6a0ff", bold = true }
select_alt  = { fg = "#b6a0ff", bg = "#303030" }

unset_main  = { fg = "#000000", bg = "#feacd0", bold = true }
unset_alt   = { fg = "#feacd0", bg = "#303030" }

[status]
overall   = { fg = "#ffffff", bg = "#1e1e1e" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#2fafff", bg = "#2f3849" }
progress_error  = { fg = "#ff5f59", bg = "#2f3849" }

# Permissions
perm_type  = { fg = "#2fafff" }
perm_read  = { fg = "#d0bc00" }
perm_write = { fg = "#ff5f59" }
perm_exec  = { fg = "#44bc44" }
perm_sep   = { fg = "#646464" }

[pick]
border   = { fg = "#c4c4c4" }
active   = { fg = "#ffffff",  bg = "#2f447f" }
inactive = { fg = "#ffffff" }

# Input
[input]
border   = { fg = "#00d3d0" }
title    = { fg = "#00d3d0" }
value    = { fg = "#feacd0" }
selected = { bg = "#2f447f" }

# Completion
[cmp]
border   = { fg = "#00d3d0" }
active   = { fg = "#ffffff", bg = "#303030" }
inactive = { fg = "#ffffff" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

# Tasks
[tasks]
border  = { fg = "#c4c4c4" }
title   = { fg = "#c4c4c4" }
hovered = { fg = "#ffffff", bg = "#2f447f" }

# Which
[which]
cols            = 3
mask            = { bg = "#1e1e1e" }
cand            = { fg = "#00d3d0" }
rest            = { fg = "#2fafff" }
desc            = { fg = "#b6a0ff" }
separator       = " ➜ "
separator_style = { fg = "#989898" }

# Confirm
[confirm]
border  = { fg = "#00d3d0" }
title   = { fg = "#c4c4c4" }
content = {}
list    = {}
btn_yes = { bg = "#2f447f" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

# Spot
[spot]
border  = { fg = "#c4c4c4" }
title   = { fg = "#c4c4c4" }

# Notify
[notify]
title_info  = { fg = "#00d3d0" }
title_warn  = { fg = "#d0bc00" }
title_error = { fg = "#ff5f59" }

icon_error = ""
icon_warn = ""
icon_info = ""

# Help
[help]
on      = { fg = "#44bc44" }
run     = { fg = "#b6a0ff" }
desc    = { fg = "#00d3d0" }
hovered = { bg = "#2f3849" }
footer  = { fg = "#ffffff", bg = "#000000" }

[filetype]

rules = [
	# Images
	{ mime = "image/*", fg = "#d0bc00" },

	# Media
	{ mime = "{audio,video}/*", fg = "#b6a0ff" },

	# Archives
	{ mime = "application/*zip", fg = "#ff5f59" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#ff5f59" },

	# Documents
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#00d3d0" },

	# Empty files
	# { mime = "inode/x-empty", fg = "#ff5f59" },

	# Special files
	{ url = "*", is = "orphan", bg = "#ff5f59" },
	{ url = "*", is = "exec"  , fg = "#44bc44" },

	# Fallback
	{ url = "*/", fg = "#2fafff" },
	{ url = "*", fg = "#ffffff" }
]
