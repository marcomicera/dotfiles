# Tokyo Night Moon skin for k9s (aligned with Neovim tokyonight-moon)

foreground: &foreground "#c8d3f5"
background: &background "#222436"
current_line: &current_line "#2f334d"
selection: &selection "#2d3f76"
comment: &comment "#636da6"
cyan: &cyan "#86e1fc"
green: &green "#c3e88d"
yellow: &yellow "#ffc777"
orange: &orange "#ff966c"
magenta: &magenta "#c099ff"
blue: &blue "#82aaff"
red: &red "#ff757f"
purple: &purple "#fca7ea"
white: &white "#828bb8"
black: &black "#1b1d2b"
teal: &teal "#4fd6be"
error: &error "#c53b53"

k9s:
  body:
    fgColor: *foreground
    bgColor: default
    logoColor: *blue
  prompt:
    fgColor: *foreground
    bgColor: *background
    suggestColor: *orange
  info:
    fgColor: *blue
    sectionColor: *foreground
  dialog:
    fgColor: *foreground
    bgColor: default
    buttonFgColor: *foreground
    buttonBgColor: *blue
    buttonFocusFgColor: *background
    buttonFocusBgColor: *foreground
    labelFgColor: *comment
    fieldFgColor: *foreground
  frame:
    border:
      fgColor: *selection
      focusColor: *orange
    menu:
      fgColor: *foreground
      keyColor: *blue
      numKeyColor: *cyan
    crumbs:
      fgColor: *black
      bgColor: *blue
      activeColor: *orange
    status:
      newColor: *cyan
      modifyColor: *blue
      addColor: *green
      errorColor: *error
      highlightColor: *orange
      killColor: *comment
      completedColor: *comment
    title:
      fgColor: *foreground
      bgColor: default
      highlightColor: *blue
      counterColor: *blue
      filterColor: *orange
  views:
    charts:
      bgColor: default
      defaultDialColors:
        - *blue
        - *error
      defaultChartColors:
        - *blue
        - *error
    table:
      fgColor: *foreground
      bgColor: default
      cursorFgColor: *black
      cursorBgColor: *blue
      markColor: *orange
      header:
        fgColor: *foreground
        bgColor: default
        sorterColor: *cyan
    xray:
      fgColor: *foreground
      bgColor: default
      cursorColor: *current_line
      graphicColor: *blue
      showIcons: false
    yaml:
      keyColor: *blue
      colonColor: *comment
      valueColor: *foreground
    logs:
      fgColor: *foreground
      bgColor: default
      indicator:
        fgColor: *foreground
        bgColor: *selection
    help:
      fgColor: *foreground
      bgColor: default
      indicator:
        fgColor: *error
        bgColor: *selection
