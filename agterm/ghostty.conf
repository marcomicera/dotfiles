# agterm-scoped ghostty config — applies ONLY to agterm, not the standalone Ghostty.app.
# Put any ghostty config key here to override agterm's bundled defaults and your global
# ~/.config/ghostty/config. Full key reference: https://ghostty.org/docs/config
#
# Edit this file and run File ▸ Reload Config (or relaunch) to apply. Blank lines and lines
# starting with `#` are ignored. Most keys apply to open terminals on reload, but layout keys
# (window-padding-*) and shell-spawn keys (term, shell-integration-features) only take effect in
# a new session/window or after a relaunch.
#
# Example — make the macOS Option key send Alt (uncomment to enable):
# macos-option-as-alt = true
#
# NOTE: Values agterm emits from Settings load after this file and win. See the current list at
# https://agterm.com/docs#ghostty; put other keys here.
#
# NOT SUPPORTED: the `ssh-env` and `ssh-terminfo` shell-integration features. They work by
# wrapping `ssh` as a call to the `ghostty` CLI absent from agterm's bundle,
# so agterm forces them back off. Your other shell-integration-features flags are kept.
# To install the terminfo entry on a remote host once: agtermctl terminfo install <host>
#
# NO EFFECT: an `env` line naming a variable agterm injects into the shell (`TERM_PROGRAM`,
# `TERM_PROGRAM_VERSION`, `AGTERM_*`). agterm applies those after this file. Other `env` keys
# reach every new shell.

# Appearance shared with the standalone Ghostty config (ghostty/config.ghostty).
# Kept in sync by hand: agterm looks for the global Ghostty config at
# ~/.config/ghostty/config, which this setup does not use, so nothing is inherited.
#
# The theme itself is NOT here. agterm emits `theme` from its own Settings after this
# file and wins, so it is set with `agtermctl theme set` and recorded in settings.json
# as the light/dark pair (TokyoNight Day / TokyoNight Moon) plus followSystemAppearance.
#
# No `background` here either, even though agterm does NOT emit that key: an explicit
# background overrides the theme's own in BOTH appearances (ghostty applies a theme first
# whatever the line order), which is exactly what pinned this to black in light mode.
# agterm has no custom-themes directory, so a "Moon but pure black" theme is not an
# option here; each theme supplies its own background (#e1e2e7 / #222436).

# Split panes: agterm draws the divider and the inactive-pane dim itself, so ghostty's
# split-divider-color, unfocused-split-opacity and unfocused-split-fill are ignored here
# (verified on a freshly created split after a config reload: no effect at all). agterm has
# no divider styling of any kind; the only pane-distinction knob is
# Settings > Appearance > "Inactive pane and backdrop mute" (0-10, already at max 10),
# stored as inactivePaneMuteStrength in ~/Library/Application Support/agterm/settings.json.

# Gutter between split panes (agterm draws no divider line).
window-padding-x = 22
window-padding-y = 12
window-padding-balance = false
