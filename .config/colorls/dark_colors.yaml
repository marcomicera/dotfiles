# Modus, following the terminal palette. The values are the colorize gem's ANSI
# names rather than hex, so they resolve against whatever the terminal has:
# Modus Vivendi in dark, Modus Operandi in light.
# Modus puts its dim grey on 15 (light_white) and a subtle grey on 8 (light_black).
# Main Colors
unrecognized_file: yellow
recognized_file:   white
executable_file:   green
dir:               blue

# Link
dead_link: red
link:      cyan

# Special Files
socket:   green
blockdev: green
chardev:  green

# Access Modes
write:     magenta
read:      light_magenta
exec:      cyan
no_access: red

# Age
hour_old:    white
day_old:     light_white
no_modifier: light_black

# File Size
file_large:  red
file_medium: light_red
file_small:  green

# Random
report: green
user:   cyan
tree:   light_white
empty:  light_white
error:  red
normal: white
inode:  light_magenta

# Git
addition:     light_green
modification: light_blue
deletion:     red
untracked:    light_red
unchanged:    green
