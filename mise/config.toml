[tools]
glab = "latest"
helm = "latest"
kubectl = "latest"
# @getpaseo/cli is an npm global installed into this node's prefix, so a node
# must always be active or it drops off PATH entirely. happy is mise-managed
# below, so bumping node no longer takes it off PATH.
node = "26.9.0"
"npm:happy" = "latest"
remotectl = "latest"
terraform = "latest"
terragrunt = "latest"

[settings]
# hook-env evals stdout; auto-install of source builds (e.g. postgres) dumps
# `./configure` "checking ..." lines into the shell as commands.
auto_install = false

[settings.gitlab]
credential_command = "glab auth status --hostname gitlab.com >/dev/null 2>&1; glab config get token --host gitlab.com"
