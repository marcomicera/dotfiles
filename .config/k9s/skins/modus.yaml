# Modus skin for k9s. The colours are tcell's names for the first 16 palette
# entries, i.e. ANSI indices, so they resolve against the terminal palette:
# Modus Vivendi in dark, Modus Operandi in light. k9s therefore follows macOS.

foreground: &foreground "default"
background: &background "default"
current_line: &current_line "gray"
selection: &selection "gray"
comment: &comment "white"
cyan: &cyan "teal"
green: &green "green"
yellow: &yellow "olive"
orange: &orange "red"
magenta: &magenta "fuchsia"
blue: &blue "navy"
red: &red "maroon"
purple: &purple "purple"
white: &white "white"
black: &black "default"
teal: &teal "aqua"
error: &error "maroon"

k9s:
  body:
    fgColor: *foreground
    bgColor: default
    logoColor: *blue
  prompt:
    fgColor: *foreground
    bgColor: *background
    suggestColor: *orange
  info:
    fgColor: *blue
    sectionColor: *foreground
  dialog:
    fgColor: *foreground
    bgColor: default
    buttonFgColor: *foreground
    buttonBgColor: *blue
    buttonFocusFgColor: *background
    buttonFocusBgColor: *foreground
    labelFgColor: *comment
    fieldFgColor: *foreground
  frame:
    border:
      fgColor: *selection
      focusColor: *orange
    menu:
      fgColor: *foreground
      keyColor: *blue
      numKeyColor: *cyan
    crumbs:
      fgColor: *black
      bgColor: *blue
      activeColor: *orange
    status:
      newColor: *cyan
      modifyColor: *blue
      addColor: *green
      errorColor: *error
      highlightColor: *orange
      killColor: *comment
      completedColor: *comment
    title:
      fgColor: *foreground
      bgColor: default
      highlightColor: *blue
      counterColor: *blue
      filterColor: *orange
  views:
    charts:
      bgColor: default
      defaultDialColors:
        - *blue
        - *error
      defaultChartColors:
        - *blue
        - *error
    table:
      fgColor: *foreground
      bgColor: default
      cursorFgColor: *black
      cursorBgColor: *blue
      markColor: *orange
      header:
        fgColor: *foreground
        bgColor: default
        sorterColor: *cyan
        selectedSortColumnColor: *orange
    xray:
      fgColor: *foreground
      bgColor: default
      cursorColor: *current_line
      graphicColor: *blue
      showIcons: false
    yaml:
      keyColor: *blue
      colonColor: *comment
      valueColor: *foreground
    logs:
      fgColor: *foreground
      bgColor: default
      indicator:
        fgColor: *foreground
        bgColor: default
        toggleOffColor: *red
    help:
      fgColor: *foreground
      bgColor: default
      indicator:
        fgColor: *error
        bgColor: *selection
