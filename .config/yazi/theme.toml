[mgr]
# Colours are the 16 ANSI names, not hex, so they come from whatever palette the
# terminal has: Modus Vivendi in dark, Modus Operandi in light. That is what makes
# yazi follow the macOS appearance.
# NOTE: can be combined with tmTheme (sublime colorshceme file) for preview code highlight
syntect_theme = "~/.config/bat/themes/modus_vivendi.tmTheme"

cwd = { fg = "white", italic = true }

# Hovered
hovered         = { bg = "black" }
preview_hovered = { bg = "black" }

# Find
find_keyword  = { fg = "reset", bg = "magenta", bold = true }
find_position = { fg = "cyan", bg = "black", bold = true }

# Marker
marker_copied   = { fg = "green", bg = "green" }
marker_cut      = { fg = "red", bg = "red" }
marker_marked   = { fg = "lightmagenta", bg = "lightmagenta" }
marker_selected = { fg = "blue", bg = "blue" }

# Count
count_copied   = { fg = "reset", bg = "green" }
count_cut      = { fg = "reset", bg = "red" }
count_selected = { fg = "reset", bg = "blue" }

# Border
border_symbol = "│"
border_style  = { fg = "white" }

# Tab
[tabs]
active   = { fg = "reset", bg = "blue" }
inactive = { fg = "blue", bg = "black" }

[mode]
normal_main = { fg = "reset", bg = "blue", bold = true }
normal_alt  = { fg = "blue", bg = "black" }

select_main = { fg = "reset", bg = "lightmagenta", bold = true }
select_alt  = { fg = "lightmagenta", bg = "black" }

unset_main  = { fg = "reset", bg = "magenta", bold = true }
unset_alt   = { fg = "magenta", bg = "black" }

[status]
overall   = { fg = "reset", bg = "black" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "reset", bold = true }
progress_normal = { fg = "blue", bg = "black" }
progress_error  = { fg = "red", bg = "black" }

# Permissions
perm_type  = { fg = "blue" }
perm_read  = { fg = "yellow" }
perm_write = { fg = "red" }
perm_exec  = { fg = "green" }
perm_sep   = { fg = "white" }

[pick]
border   = { fg = "white" }
active   = { fg = "reset",  bg = "black" }
inactive = { fg = "reset" }

# Input
[input]
border   = { fg = "cyan" }
title    = { fg = "cyan" }
value    = { fg = "magenta" }
selected = { bg = "black" }

# Completion
[cmp]
border   = { fg = "cyan" }
active   = { fg = "reset", bg = "black" }
inactive = { fg = "reset" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

# Tasks
[tasks]
border  = { fg = "white" }
title   = { fg = "white" }
hovered = { fg = "reset", bg = "black" }

# Which
[which]
cols            = 3
mask            = { bg = "black" }
cand            = { fg = "cyan" }
rest            = { fg = "blue" }
desc            = { fg = "lightmagenta" }
separator       = " ➜ "
separator_style = { fg = "white" }

# Confirm
[confirm]
border  = { fg = "cyan" }
title   = { fg = "white" }
content = {}
list    = {}
btn_yes = { bg = "black" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

# Spot
[spot]
border  = { fg = "white" }
title   = { fg = "white" }

# Notify
[notify]
title_info  = { fg = "cyan" }
title_warn  = { fg = "yellow" }
title_error = { fg = "red" }

icon_error = ""
icon_warn = ""
icon_info = ""

# Help
[help]
on      = { fg = "green" }
run     = { fg = "lightmagenta" }
desc    = { fg = "cyan" }
hovered = { bg = "black" }
footer  = { fg = "reset", bg = "reset" }

[filetype]

rules = [
	# Images
	{ mime = "image/*", fg = "yellow" },

	# Media
	{ mime = "{audio,video}/*", fg = "lightmagenta" },

	# Archives
	{ mime = "application/*zip", fg = "red" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "red" },

	# Documents
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "cyan" },

	# Empty files
	# { mime = "inode/x-empty", fg = "red" },

	# Special files
	{ url = "*", is = "orphan", bg = "red" },
	{ url = "*", is = "exec"  , fg = "green" },

	# Fallback
	{ url = "*/", fg = "blue" },
	{ url = "*", fg = "reset" }
]
